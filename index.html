// ---------- 基本常量 ----------
const TILE=16, VIEW_W=384, VIEW_H=224;

const ctx=canvas.getContext('2d');

ctx.imageSmoothingEnabled=false;

function fitScreen(){
  const s=Math.max(1,Math.floor(Math.min(innerWidth/VIEW_W,(innerHeight-24)/VIEW_H)));
  const fs=Math.min(innerWidth/VIEW_W,(innerHeight-24)/VIEW_H);
  const useF=fs<1?fs:s; // 小屏时允许非整数缩放
  canvas.style.width=(VIEW_W*useF)+'px';
  canvas.style.height=(VIEW_H*useF)+'px';
}
addEventListener('resize',fitScreen); fitScreen();

// ---------- 工具 ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sign=v=>v<0?-1:v>0?1:0;
const aabb=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
// 种子随机（装饰物摆放用，保证每次一致）
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;}}

// ---------- 输入 ----------
const keys={},pressed={};
const KEYMAP={
  left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],
  jump:['ArrowUp','KeyW','Space'],down:['ArrowDown','KeyS'],
  pause:['KeyP'],mute:['KeyM'],restart:['KeyR'],back:['Escape'],
  confirm:['Enter','Space','ArrowUp','KeyW']
};
function down(name){return KEYMAP[name].some(c=>keys[c]);}
function hit(name){return KEYMAP[name].some(c=>pressed[c]);}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(!keys[e.code])pressed[e.code]=true; keys[e.code]=true;
  audioUnlock();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
// 每帧末清空 pressed
function clearPressed(){for(const k in pressed)pressed[k]=false;}

// ---------- 音频：WebAudio 合成 ----------
let AC=null,masterGain=null,musicGain=null,sfxGain=null,audioOn=true,musicOn=true;
try{audioOn=localStorage.getItem('pq_audio')!=='0';musicOn=localStorage.getItem('pq_music')!=='0';}catch(e){}
function audioUnlock(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=AC.createGain();masterGain.gain.value=audioOn?1:0;masterGain.connect(AC.destination);
    musicGain=AC.createGain();musicGain.gain.value=musicOn?0.55:0;musicGain.connect(masterGain);
    sfxGain=AC.createGain();sfxGain.gain.value=0.8;sfxGain.connect(masterGain);
    startMusic();
  }catch(e){AC=null;}
}
function toggleAudio(){audioOn=!audioOn;if(masterGain)masterGain.gain.value=audioOn?1:0;
  try{localStorage.setItem('pq_audio',audioOn?'1':'0');}catch(e){}}
function toggleMusic(){musicOn=!musicOn;if(musicGain)musicGain.gain.value=musicOn?0.55:0;
  try{localStorage.setItem('pq_music',musicOn?'1':'0');}catch(e){}}

// 单音：类型/频率滑动/音量包络
function tone(o){
  if(!AC||!audioOn)return;
  const t0=AC.currentTime+(o.at||0);
  const osc=AC.createOscillator(),g=AC.createGain();
  osc.type=o.type||'square';
  osc.frequency.setValueAtTime(o.f,t0);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t0+o.d);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(o.v||0.3,t0+(o.a||0.005));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+o.d);
  osc.connect(g);g.connect(o.music?musicGain:sfxGain);
  osc.start(t0);osc.stop(t0+o.d+0.02);
}
function noise(o){
  if(!AC||!audioOn)return;
  const t0=AC.currentTime+(o.at||0),len=Math.floor(AC.sampleRate*o.d);
  const buf=AC.createBuffer(1,len,AC.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
  const src=AC.createBufferSource();src.buffer=buf;
  const g=AC.createGain();g.gain.value=o.v||0.25;
  const f=AC.createBiquadFilter();f.type=o.hp?'highpass':'lowpass';f.frequency.value=o.fc||1000;
  src.connect(f);f.connect(g);g.connect(sfxGain);src.start(t0);
}

// ---------- 背景音乐：简易双轨循环 ----------
const MUSIC_LEAD=[  // 16 步主旋律（0=休止），A 小调轻快
 440,523,659,0, 587,659,784,0, 659,523,440,0, 494,587,494,0,
 440,523,659,0, 587,659,784,0, 880,784,659,523, 587,494,440,0 ];
const MUSIC_BASS=[110,0,165,0, 110,0,165,0, 131,0,196,0, 131,0,196,0,
 110,0,165,0, 110,0,165,0, 147,0,110,0, 165,0,110,0];
let musicTimer=null,musicStep=0;
function startMusic(){
  if(musicTimer||!AC)return;
  const stepDur=0.155; // 8 分音符
  let nextT=AC.currentTime+0.1;
  musicTimer=setInterval(()=>{
    if(!AC)return;
    while(nextT<AC.currentTime+0.35){
      const i=musicStep%MUSIC_LEAD.length;
      const lf=MUSIC_LEAD[i],bf=MUSIC_BASS[i];
      if(lf)tone({f:lf,d:stepDur*0.9,v:0.10,type:'square',music:true,at:nextT-AC.currentTime});
      if(bf)tone({f:bf,d:stepDur*1.6,v:0.16,type:'triangle',music:true,at:nextT-AC.currentTime});
      nextT+=stepDur;musicStep++;
    }
  },120);
}

function drawPixelText(str,x,y,scale,color,align){
  str=String(str);
  const gw=4*scale; // 3px 宽 + 1px 间隔
  let w=str.length*gw-scale;
  if(align==='center')x-=Math.round(w/2);
  else if(align==='right')x-=w;
  ctx.fillStyle=color;
  for(let i=0;i<str.length;i++){
    const g=FONT[str[i]]||FONT['?'];
    for(let r=0;r<5;r++)for(let c=0;c<3;c++)
      if(g[r*3+c]==='1')ctx.fillRect(x+i*gw+c*scale,y+r*scale,scale,scale);
  }
}
// 中文小字（系统字体，小尺寸+像素化缩放可接受）
function drawCNText(str,x,y,px,color,align){
  ctx.save();
  ctx.font='bold '+px+'px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.textAlign=align||'left';ctx.textBaseline='top';
  ctx.fillStyle=color;ctx.fillText(str,x,y);
  ctx.restore();
}

function makeSprite(rows,pal){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const ch=rows[y][x];
    if(ch&&ch!=='.'&&pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1);}
  }
  return c;
}
function flipSprite(spr){
  const c=document.createElement('canvas');c.width=spr.width;c.height=spr.height;
  const g=c.getContext('2d');g.translate(spr.width,0);g.scale(-1,1);g.drawImage(spr,0,0);
  return c;
}

function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function blockTile(th,capped){
  const c=makeCanvas(16,16),g=c.getContext('2d');
  g.fillStyle=th.block;g.fillRect(0,0,16,16);
  const rnd=mulberry(1234);
  g.fillStyle=th.speck;
  for(let i=0;i<7;i++)g.fillRect(2+Math.floor(rnd()*12),2+Math.floor(rnd()*12),2,1);
  g.fillStyle=th.blockD;g.fillRect(0,15,16,1);g.fillRect(15,0,1,16);
  g.fillStyle=th.blockL;g.fillRect(0,0,16,1);g.fillRect(0,0,1,16);
  if(capped){
    g.fillStyle=th.cap;g.fillRect(0,0,16,5);
    g.fillStyle=th.capL;g.fillRect(0,0,16,1);
    g.fillStyle=th.capD;g.fillRect(0,4,16,1);

  }else if(th===THEMES.lava){
    gf.fillStyle=th.far;

// ---------- 关卡构建 DSL ----------
// 字符含义：# 实体砖  I 冰砖  = 单向平台  ^ 尖刺 v 吊刺 ~ 熔岩
// o 金币 * 宝石 S 弹簧 C 崩塌砖  K 钥匙 D 门 L 拉杆
// a/b 切换砖(橙/蓝)  M 横移平台 V 竖移平台  W 史莱姆 F 蝙蝠
// < > 大炮(朝向)  Z 横锯 U 竖锯  ( ) 传送带  @ 出生点 P 终点旗 c 检查点
class LG{
  constructor(w,h){this.w=w;this.h=h;
    this.g=Array.from({length:h},()=>Array(w).fill('.'));}
  set(x,y,ch){if(x>=0&&x<this.w&&y>=0&&y<this.h)this.g[y][x]=ch;return this;}
  fill(x0,y0,x1,y1,ch){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)this.set(x,y,ch);return this;}
  ground(x0,x1,topY,fillY){return this.fill(x0,topY,x1,fillY===undefined?this.h-1:fillY,'#');}
  plat(x0,x1,y){for(let x=x0;x<=x1;x++)this.set(x,y,'=');return this;}
  row(x0,x1,y,ch){for(let x=x0;x<=x1;x++)this.set(x,y,ch);return this;}
  coins(x0,x1,y){return this.row(x0,x1,y,'o');}
  coinArc(cx,y,n){ // n 个金币的抛物线弧
    for(let i=0;i<n;i++){const t=i/(n-1)-0.5;
      this.set(cx+i,y-Math.round((1-(t*t)*4)*2.2),'o');}
    return this;}
  stairs(x,y,steps,dir){ // dir=1 向右上
    for(let i=0;i<steps;i++)for(let j=0;j<=i;j++)
      this.set(x+i*dir,y-j,'#');
    return this;}
}

// 关卡字符 → 是否初始实心
const SOLID_CH=new Set(['#','I','D','a']);

// 引擎核心
// ============================================================
const PHY={grav:1500,maxFall:360,acc:1400,fric:1800,fricIce:180,
  maxRun:120,jumpV:330,springV:520,coyote:0.09,buffer:0.11};

class Level{
  constructor(idx){
    const meta=LEVELS[idx];
    this.idx=idx; this.meta=meta; this.theme=THEMES[meta.theme];
    const g=new LG(0,0); // 仅为类型引用，实际尺寸由 build 决定
    const H=meta.theme==='tower'?36:(meta.theme==='cave'?20:(meta.theme==='factory'?18:(meta.theme==='lava'?16:14)));
    this.w=meta.theme==='tower'?44:Math.max(100,10);
    // 为每关显式指定尺寸
    const SIZES=[[100,14],[110,20],[120,14],[120,18],[130,16],[44,36]][idx];
    const lg=new LG(SIZES[0],SIZES[1]);
    meta.build(lg);
    this.tw=SIZES[0]; this.th=SIZES[1];
    this.tiles=lg.g;
    // 实体提取
    this.coins=[]; this.enemies=[]; this.plats=[]; this.saws=[]; this.cannons=[];
    this.springs=[]; this.levers=[]; this.checkpoints=[]; this.crumbles=new Map();
    this.doors=new Map(); this.spawn={x:32,y:32}; this.goal=null; this.keysTotal=0;
    for(let y=0;y<this.th;y++)for(let x=0;x<this.tw;x++){
      const ch=this.tiles[y][x];
      const px=x*TILE,py=y*TILE;
      switch(ch){
        case '@': this.spawn={x:px+3,y:py+2}; this.tiles[y][x]='.'; break;
        case 'P': this.goal={x:px,y:py-16,w:16,h:32}; this.tiles[y][x]='.'; break;
        case 'o': this.coins.push({x:px+4,y:py+4,w:8,h:8,got:false,t:Math.random()*6}); this.tiles[y][x]='.'; break;
        case '*': this.coins.push({x:px+4,y:py+3,w:8,h:10,got:false,gem:true,t:Math.random()*6}); this.tiles[y][x]='.'; break;
        case 'K': this.coins.push({x:px+3,y:py+5,w:10,h:6,got:false,key:true,t:0}); this.keysTotal++; this.tiles[y][x]='.'; break;
        case 'W': this.enemies.push(this.mkSlime(px+2,py+6)); this.tiles[y][x]='.'; break;
        case 'F': this.enemies.push(this.mkBat(px+2,py+3)); this.tiles[y][x]='.'; break;
        case 'M': this.plats.push(this.mkPlat(px,py,1)); this.tiles[y][x]='.'; break;
        case 'V': this.plats.push(this.mkPlat(px,py,0)); this.tiles[y][x]='.'; break;
        case 'Z': this.saws.push(this.mkSaw(px+8,py+8,1)); this.tiles[y][x]='.'; break;
        case 'U': this.saws.push(this.mkSaw(px+8,py+8,0)); this.tiles[y][x]='.'; break;
        case '<': this.cannons.push({x:px,y:py,dir:-1,t:Math.random()*1.8,flash:0}); this.tiles[y][x]='.'; break;
        case '>': this.cannons.push({x:px,y:py,dir:1,t:Math.random()*1.8,flash:0}); this.tiles[y][x]='.'; break;
        case 'S': this.springs.push({x:px+2,y:py+8,w:12,h:8,t:0}); this.tiles[y][x]='.'; break;
        case 'L': this.levers.push({x:px+2,y:py+2,w:12,h:14,cd:0}); this.tiles[y][x]='.'; break;
        case 'c': this.checkpoints.push({x:px,y:py-8,w:16,h:24,on:false}); this.tiles[y][x]='.'; break;
        case 'C': this.crumbles.set(x+','+y,{x,y,state:0,t:0,dy:0}); break; // 0稳 1抖 2落 3无
        case 'D': this.doors.set(x+','+y,{x,y}); break;
      }
    }
    // 门的相邻分组
    this.doorGroups=[];
    const seen=new Set();
    for(const k of this.doors.keys()){
      if(seen.has(k))continue;
      const grp=[];const q=[k];seen.add(k);
      while(q.length){const cur=q.pop();const[cx,cy]=cur.split(',').map(Number);grp.push(cur);
        for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
          const nk=(cx+dx)+','+(cy+dy);
          if(this.doors.has(nk)&&!seen.has(nk)){seen.add(nk);q.push(nk);}}}
      this.doorGroups.push(grp);
    }
    // 电锯轨道边界（左右/上下扫描实心砖）
    for(const s of this.saws){
      let l=0,r=0;
      if(s.hz){ while(l<7&&!this.rawSolid(s.tx-1-l,s.ty))l++;
        while(r<7&&!this.rawSolid(s.tx+1+r,s.ty))r++;
        l=Math.min(Math.max(l,1),6);r=Math.min(Math.max(r,1),6);
        s.minX=(s.tx-l)*TILE+10; s.maxX=(s.tx+r)*TILE+6; s.dir=1;
      }else{ while(l<7&&!this.rawSolid(s.tx,s.ty-1-l))l++;
        while(r<7&&!this.rawSolid(s.tx,s.ty+1+r))r++;
        l=Math.min(Math.max(l,1),6);r=Math.min(Math.max(r,1),6);
        s.minY=(s.ty-l)*TILE+10; s.maxY=(s.ty+r)*TILE+6; s.dir=1; }
    }
    // 装饰物（种子随机，贴在草皮/砖顶上）
    this.decor=[];
    const rnd=mulberry(99+idx*17);
    const dsets={grass:['bush','flower','bush','mushroom'],cave:['crystal','mushroom','crystal'],
      sky:['cloudpot','flower'],factory:['gear','chain','gear'],lava:['torch','skull','torch'],
      tower:['torch','crystal','gear']};
    const set=dsets[meta.theme];
    for(let y=0;y<this.th;y++)for(let x=0;x<this.tw;x++){
      if(this.tiles[y][x]==='#'&&y>0&&this.tiles[y-1][x]==='.'&&rnd()<0.16){
        this.decor.push({x:x*TILE+(rnd()*8|0),y:y*TILE,type:set[rnd()*set.length|0],f:rnd()*2|0});
      }
    }
    this.totalCoin=this.coins.filter(c=>!c.key).reduce((a,c)=>a+(c.gem?5:1),0);
    this.par=meta.par;
  }
  mkSlime(x,y){return{type:'slime',x,y,w:12,h:10,vx:-28,vy:0,dead:0,t:Math.random()*6,home:x};}
  mkBat(x,y){return{type:'bat',x,y,w:12,h:10,ax:x,ay:y,vx:40,vy:0,dead:0,t:Math.random()*6,rng:44};}
  mkPlat(x,y,hz){return{x,y,w:48,h:8,hz,dir:1,spd:36,minX:x-56,maxX:x+56,minY:y-48,maxY:y+48,dx:0,dy:0};}
  mkSaw(x,y,hz){return{x,y,r:7.5,hz,dir:1,spd:52,tx:Math.round(x/16),ty:Math.round(y/16),t:0};}
  tileAt(tx,ty){
    if(tx<0||tx>=this.tw)return '#';
    if(ty<0||ty>=this.th)return '.';
    return this.tiles[ty][tx];
  }
  rawSolid(tx,ty){
    const ch=this.tileAt(tx,ty);
    return ch==='#'||ch==='I'||ch==='a'||ch==='b'||ch==='D';
  }
  solid(tx,ty,switchState){
    const ch=this.tileAt(tx,ty);
    if(ch==='#'||ch==='I')return true;
    if(ch==='a')return switchState===0;
    if(ch==='b')return switchState===1;
    if(ch==='D')return this.doors.has(tx+','+ty);
    if(ch==='C'){const c=this.crumbles.get(tx+','+ty);return c&&c.state<2;}
    return false;
  }
}

  game.level=new Level(idx);
  const L=game.level;
  if(!keepStats){game.time=0;game.deaths=0;game.coins=0;game.keys=0;game.switchState=0;}
  game.bullets=[];game.parts=[];
  game.respawnAt={x:L.spawn.x,y:L.spawn.y};
  game.player=mkPlayer(L.spawn.x,L.spawn.y);
  game.cam.x=clamp(L.spawn.x-VIEW_W/2,0,L.tw*TILE-VIEW_W);
  game.cam.y=clamp(L.spawn.y-VIEW_H/2,0,Math.max(0,L.th*TILE-VIEW_H));
  game.hintT=3.5; game.fade=1; game.fadeDir=-1;
}

function respawn(){
  const p=game.player,L=game.level;
  p.x=game.respawnAt.x;p.y=game.respawnAt.y;p.vx=0;p.vy=0;p.dead=false;p.standOn=null;
  game.bullets=[];
  for(const e of L.enemies){e.dead=0;e.x=e.type==='bat'?e.ax:e.home;e.y=e.type==='bat'?e.ay:e.y;}
  for(const c of L.crumbles.values()){c.state=0;c.t=0;c.dy=0;}
}

function addParts(x,y,n,color,spd,grav){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=spd*(0.3+Math.random()*0.7);
    game.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spd*0.3,life:0.5+Math.random()*0.4,
      color,size:1+Math.random()*2,grav:grav===undefined?300:grav});}
}

function killPlayer(){
  const p=game.player;
  if(p.dead||game.state!=='play')return;
  p.dead=true;p.deadT=0;game.deaths++;game.shake=6;
  SFX.die();
  addParts(p.x+5,p.y+7,18,'#f08830',120);
  addParts(p.x+5,p.y+7,10,'#f8d020',90);
}

// ---------- 碰撞辅助 ----------
function rectVsTiles(L,rx,ry,rw,rh,cb){ // 遍历覆盖的格子
  const x0=Math.floor(rx/TILE),x1=Math.floor((rx+rw-1)/TILE);
  const y0=Math.floor(ry/TILE),y1=Math.floor((ry+rh-1)/TILE);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)cb(tx,ty,L.tileAt(tx,ty));
}

function updatePlayer(dt){
  const p=game.player,L=game.level;
  if(p.dead){p.deadT+=dt;if(p.deadT>0.9)respawn();return;}
  // 输入
  const dir=(down('right')?1:0)-(down('left')?1:0);
  // 冰面检测
  let onIce=false;
  if(p.onGround){
    const ty=Math.floor((p.y+p.h+1)/TILE);
    rectVsTiles(L,p.x,p.y,p.w,1,(tx,ty2,ch)=>{if(ch==='I')onIce=true;});
  }
  const fric=onIce?PHY.fricIce:PHY.fric;
  if(dir!==0){p.vx+=dir*PHY.acc*dt;p.face=dir;}
  else{const s=sign(p.vx);p.vx-=s*fric*dt;if(sign(p.vx)!==s)p.vx=0;}
  p.vx=clamp(p.vx,-PHY.maxRun,PHY.maxRun);
  // 传送带
  if(p.onGround){
    const ty=Math.floor((p.y+p.h+1)/TILE);
    rectVsTiles(L,p.x,p.y,p.w,1,(tx,ty2,ch)=>{
      if(ch==='(')p.vx=clamp(p.vx-520*dt,-170,170);
      if(ch===')')p.vx=clamp(p.vx+520*dt,-170,170);
    });
  }
  // 跳跃
  if(hit('jump'))p.jbuf=PHY.buffer;
  p.jbuf-=dt;p.coyote-=dt;
  if(p.onGround)p.coyote=PHY.coyote;
  if(p.jbuf>0&&p.coyote>0){
    p.vy=-PHY.jumpV;p.jbuf=0;p.coyote=0;p.onGround=false;p.standOn=null;
    SFX.jump();addParts(p.x+5,p.y+14,4,L.theme.dust,40,200);
  }
  // 松手截断跳跃
  if(p.vy<0&&!down('jump'))p.vy*=0.94; // 渐弱式截断，手感更顺
  p.vy=Math.min(p.vy+PHY.grav*dt,PHY.maxFall);
  // 平台载人
  if(p.standOn){
    p.x+=p.standOn.dx;p.y+=p.standOn.dy;
  }
  const wasFeet=p.y+p.h;
  // X 轴
  p.x+=p.vx*dt;
  {
    const y0=Math.floor(p.y/TILE),y1=Math.floor((p.y+p.h-1)/TILE);
    if(p.vx>0){
      const tx=Math.floor((p.x+p.w-1)/TILE);
      for(let ty=y0;ty<=y1;ty++)if(L.solid(tx,ty,game.switchState)){p.x=tx*TILE-p.w;p.vx=0;break;}
    }else if(p.vx<0){
      const tx=Math.floor(p.x/TILE);
      for(let ty=y0;ty<=y1;ty++)if(L.solid(tx,ty,game.switchState)){p.x=(tx+1)*TILE;p.vx=0;break;}
    }
  }
  // Y 轴
  p.y+=p.vy*dt;
  const wasGround=p.onGround;
  p.onGround=false;const prevStand=p.standOn;p.standOn=null;
  {
    const x0=Math.floor(p.x/TILE),x1=Math.floor((p.x+p.w-1)/TILE);
    if(p.vy>0){
      const ty=Math.floor((p.y+p.h-1)/TILE);
      for(let tx=x0;tx<=x1;tx++){
        const ch=L.tileAt(tx,ty);
        const oneWay=ch==='=';
        const sol=L.solid(tx,ty,game.switchState)||oneWay;
        if(sol&&wasFeet<=ty*TILE+0.5){ // 单向平台：从上方落入才停
          p.y=ty*TILE-p.h;p.vy=0;p.onGround=true;break;
        }
        if(sol&&!oneWay){p.y=ty*TILE-p.h;p.vy=0;p.onGround=true;break;}
      }
    }else if(p.vy<0){
      const ty=Math.floor(p.y/TILE);
      for(let tx=x0;tx<=x1;tx++)if(L.solid(tx,ty,game.switchState)){p.y=(ty+1)*TILE;p.vy=0;break;}
    }
  }
  // 移动平台（实体）
  for(const pl of L.plats){
    if(p.vy>=0&&p.x+p.w>pl.x+2&&p.x<pl.x+pl.w-2&&
       p.y+p.h>=pl.y-1&&p.y+p.h<=pl.y+9&&wasFeet<=pl.y+6){
      p.y=pl.y-p.h;p.vy=0;p.onGround=true;p.standOn=pl;
    }else if(p.standOn===null&&prevStand===pl&&p.vy>=0&&p.x+p.w>pl.x&&p.x<pl.x+pl.w&&
       Math.abs(p.y+p.h-pl.y)<6){p.standOn=pl;p.onGround=true;p.y=pl.y-p.h;p.vy=0;}
  }
  if(p.onGround&&!wasGround&&p.landT<=0){
    addParts(p.x+5,p.y+14,3,L.theme.dust,30,200);p.landT=0.15;
  }
  p.landT-=dt;
  // 弹簧
  for(const s of L.springs){s.t-=dt;}
    if(p.vy>=0&&p.x+p.w>s.x&&p.x<s.x+s.w&&p.y+p.h>=s.y-2&&p.y+p.h<=s.y+10){
      p.vy=-PHY.springV;p.onGround=false;p.standOn=null;s.t=0.25;
      SFX.spring();addParts(s.x+6,s.y,8,'#f8d020',70,250);
    }
  }
  // 尖刺/熔岩
  let hazard=false;
  rectVsTiles(L,p.x+1,p.y+2,p.w-2,p.h-3,(tx,ty,ch)=>{
    if(ch==='^'&&p.y+p.h>ty*TILE+8)hazard=true;
    if(ch==='v'&&p.y<ty*TILE+8)hazard=true;
    if(ch==='~'&&p.y+p.h>ty*TILE+3)hazard=true;
  });
  if(hazard)killPlayer();
  if(p.y>L.th*TILE+24)killPlayer(); // 坠落
  // 动画
  p.animT+=dt;
  if(!p.onGround)p.anim=p.vy<0?'jump':'fall';
  else if(Math.abs(p.vx)>10)p.anim='run';else p.anim='idle';
}
function prevOnGroundWas(){return false;}

// ---------- 机关更新 ----------
function updateMechs(dt){
  const L=game.level,p=game.player;
  // 拉杆
  for(const lv of L.levers){
    lv.cd-=dt;
    if(lv.cd<=0&&aabb(p,{x:lv.x,y:lv.y,w:lv.w,h:lv.h})&&(Math.abs(p.vx)>5||p.vy!==0||hit('jump'))){
      game.switchState^=1;lv.cd=0.6;SFX.switch();
      addParts(lv.x+6,lv.y+6,6,game.switchState?'#48d848':'#f87830',50,150);
    }
  }
  // 拾取
  for(const c of L.coins){
    if(c.got)continue;c.t+=dt;
    if(aabb(p,c)){
      c.got=true;
      if(c.key){game.keys++;SFX.key();addParts(c.x+5,c.y+3,10,'#f8d020',60,100);}
      else if(c.gem){game.coins+=5;SFX.gem();addParts(c.x+4,c.y+5,14,'#48d8e8',80,100);}
      else{game.coins++;SFX.coin();addParts(c.x+4,c.y+4,5,'#f8d020',50,100);}
    }
  }
  // 门
  if(game.keys>0){
    rectVsTiles(L,p.x,p.y,p.w,p.h,(tx,ty,ch)=>{
      if(ch==='D'&&game.keys>0){
        const grp=L.doorGroups.find(g=>g.includes(tx+','+ty));
        if(grp){for(const k of grp){const[dx,dy]=k.split(',').map(Number);
          L.tiles[dy][dx]='.';L.doors.delete(k);
          addParts(dx*16+8,dy*16+8,8,'#8a5a2a',60,250);}
          game.keys--;SFX.door();}
      }
    });
  }
  // 检查点
  for(const c of L.checkpoints){
    if(!c.on&&aabb(p,c)){c.on=true;game.respawnAt={x:c.x+3,y:c.y+6};
      SFX.checkpoint();addParts(c.x+8,c.y+8,10,'#48d848',60,80);}
  }
  // 终点
  if(L.goal&&aabb(p,L.goal))return levelClear();
  // 崩塌砖
  for(const c of L.crumbles.values()){
    if(c.state===0){ // 玩家踩着？
      if(p.onGround&&Math.abs((p.x+p.w/2)-(c.x*16+8))<10&&Math.abs((p.y+p.h)-c.y*16)<3){
        c.state=1;c.t=0.45;SFX.crumble();}
    }else if(c.state===1){c.t-=dt;
      if(p.onGround&&Math.abs((p.y+p.h)-c.y*16)<3)c.t=Math.min(c.t,0.12);
      if(c.t<=0){c.state=2;c.t=0;SFX.crumble();
        addParts(c.x*16+8,c.y*16+8,8,L.theme.block,60,350);}
    }else if(c.state===2){c.dy+=250*dt;c.t+=dt;
      if(c.t>1.6)c.state=3,c.t=0;
    }else if(c.state===3){c.t+=dt;
      if(c.t>1.2&&!aabb(p,{x:c.x*16,y:c.y*16,w:16,h:16})){c.state=0;c.dy=0;}
    }
  }
  // 移动平台
  for(const pl of L.plats){
    if(pl.hz){pl.x+=pl.dir*pl.spd*dt;
      if(pl.x>pl.maxX){pl.x=pl.maxX;pl.dir=-1;}
      if(pl.x<pl.minX){pl.x=pl.minX;pl.dir=1;}
      pl.dx=pl.dir*pl.spd*dt;pl.dy=0;
    }else{pl.y+=pl.dir*pl.spd*dt;
      if(pl.y>pl.maxY){pl.y=pl.maxY;pl.dir=-1;}
      if(pl.y<pl.minY){pl.y=pl.minY;pl.dir=1;}
      pl.dy=pl.dir*pl.spd*dt;pl.dx=0;
    }
  }
  // 电锯
  for(const s of L.saws){
    s.t+=dt;
    if(s.hz){s.x+=s.dir*s.spd*dt;
      if(s.x>s.maxX){s.x=s.maxX;s.dir=-1;}if(s.x<s.minX){s.x=s.minX;s.dir=1;}
    }else{s.y+=s.dir*s.spd*dt;
      if(s.y>s.maxY){s.y=s.maxY;s.dir=-1;}if(s.y<s.minY){s.y=s.minY;s.dir=1;}
    }
    // 圆 vs 玩家矩形
    const nx=clamp(s.x,p.x,p.x+p.w),ny=clamp(s.y,p.y,p.y+p.h);
    if((nx-s.x)**2+(ny-s.y)**2<s.r*s.r)killPlayer();
  }
  // 大炮
  for(const cn of L.cannons){
    cn.t-=dt;cn.flash-=dt;
    if(cn.t<=0){cn.t=1.9;cn.flash=0.12;SFX.shot();
      game.bullets.push({x:cn.x+(cn.dir>0?16:-8),y:cn.y+4,w:8,h:6,vx:cn.dir*105});}
  }
  game.bullets=game.bullets.filter(b=>{
    b.x+=b.vx*dt;
    const tx=Math.floor((b.x+4)/TILE),ty=Math.floor((b.y+3)/TILE);
    if(L.rawSolid(tx,ty)&&L.solid(tx,ty,game.switchState)){addParts(b.x+4,b.y+3,4,'#f8b020',50,150);return false;}
    if(aabb(b,p)){killPlayer();return false;}
    return b.x>-20&&b.x<L.tw*TILE+20;
  });
  // 敌人
  for(const e of L.enemies){
    if(e.dead>0){e.dead+=dt;continue;}
    e.t+=dt;
    if(e.type==='slime'){
      e.vy=Math.min(e.vy+PHY.grav*dt,300);
      e.y+=e.vy*dt;
      {const ty=Math.floor((e.y+e.h)/TILE);
       const x0=Math.floor(e.x/TILE),x1=Math.floor((e.x+e.w-1)/TILE);
       for(let tx=x0;tx<=x1;tx++)if(L.solid(tx,ty,game.switchState)){e.y=ty*TILE-e.h;e.vy=0;
         e.grounded=true;break;}}
      e.x+=e.vx*dt;
      {const dir=sign(e.vx);
       const tx=dir>0?Math.floor((e.x+e.w)/TILE):Math.floor(e.x/TILE);
       const my=Math.floor((e.y+e.h/2)/TILE);
       const fy=Math.floor((e.y+e.h+2)/TILE);
       if(L.solid(tx,my,game.switchState)||e.grounded&&!L.solid(tx,fy,game.switchState))e.vx=-e.vx;}
      if(e.y>L.th*TILE+30)e.dead=99;
    }else{ // 蝙蝠
      e.x+=e.vx*dt;
      if(Math.abs(e.x-e.ax)>e.rng)e.vx=-Math.sign(e.x-e.ax)*Math.abs(e.vx);
      e.y=e.ay+Math.sin(e.t*2.2)*7;
    }
    // 与玩家交互
    if(!p.dead&&aabb(p,e)){
      if(p.vy>60&&p.y+p.h-e.y<9){ // 踩踏
        e.dead=0.01;p.vy=-250;SFX.stomp();
        addParts(e.x+6,e.y+4,10,e.type==='bat'?'#8858c8':'#58c848',70,250);
      }else killPlayer();
    }
  }
  // 粒子
  game.parts=game.parts.filter(pt=>{
    pt.life-=dt;pt.vy+=pt.grav*dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;return pt.life>0;});
}

function levelClear(){
  if(game.state!=='play')return;
  game.state='clear';game.clearT=0;SFX.clear();
  const L=game.level,p=game.player;
  for(let i=0;i<40;i++)addParts(p.x+5+((Math.random()*60)-30),p.y-20-Math.random()*40,1,
    ['#f8d020','#48d8e8','#f85888','#58c848'][i%4],90,120);
  const stars=1+(game.coins>=L.totalCoin?1:0)+(game.time<=L.par?1:0);
  const key=L.idx+'';
  game.progress.stars[key]=Math.max(game.progress.stars[key]||0,stars);
  game.progress.unlocked=Math.max(game.progress.unlocked,Math.min(LEVELS.length,L.idx+2));
  saveProgress();
}
