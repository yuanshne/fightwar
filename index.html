<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>像素勇者 Pixel Quest</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0b12;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{
    image-rendering:pixelated;image-rendering:crisp-edges;
    background:#000;box-shadow:0 0 60px rgba(0,0,0,.8);
  }
  #tip{position:fixed;left:0;right:0;bottom:8px;text-align:center;color:#5a5a72;
    font:12px/1.4 Consolas,monospace;pointer-events:none;user-select:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="384" height="224"></canvas></div>
<div id="tip">←→/AD 移动 · ↑/W/空格 跳跃(长按跳更高) · B 背包 · P 暂停 · M 声音 · R 重开 · Esc 菜单</div>
<script>
// 全局共享常量（各模块通过经典 script 共享，任何模块不得重复声明）
const VIEW_W=384,VIEW_H=224,TILE=16;
</script>
<!-- v13.1：静态资源一律带 ?v=NN。
     起因：GitHub Pages 的 CDN 对 js 缓存 10 分钟，改完推送后玩家刷新看到的还是旧文件，
     以为是「没部署」。加版本号后每次发版只改这一个数字，浏览器/CDN 会当成新 URL 重新取。
     v14：冲刺无敌帧 0.10 → 0.15（engine.js / BAL.dash.inv）。
     v15：冲刺无敌帧 0.15 → 0.20。 -->
<script src="art.js?v=15"></script>
<script src="levels.js?v=15"></script>
<!-- v7 §1.1：章节文件（顶层 CHAPTERS.push 注册对象）；未交付时浏览器对 404 静默跳过，
     游戏以已合入章节运行（10/13/16 关皆合法）；chapter2.js 与 chapter3.js 互相独立 -->
<script src="chapter2.js?v=15"></script>
<script src="chapter3.js?v=15"></script>
<script src="engine.js?v=15"></script>
<script src="ui.js?v=15"></script>
</body>
</html>
