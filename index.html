<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>像素勇者 Pixel Quest</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0b12;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{
    image-rendering:pixelated;image-rendering:crisp-edges;
    background:#000;box-shadow:0 0 60px rgba(0,0,0,.8);
  }
  #tip{position:fixed;left:0;right:0;bottom:8px;text-align:center;color:#5a5a72;
    font:12px/1.4 Consolas,monospace;pointer-events:none;user-select:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="384" height="224"></canvas></div>
<div id="tip">小关=街机小游戏（扫雷/地鼠/点灯/翻牌/推箱/贪吃蛇/矿脉寻宝/落块筑墙/弹幕生存/编钟/泡泡消除/迷宫追逃/垂直攀跃/打砖块） · Boss 关=平台动作 · P 暂停 · R 重开 · Esc 菜单</div>
<script>
// 全局共享常量（各模块通过经典 script 共享，任何模块不得重复声明）
const VIEW_W=384,VIEW_H=224,TILE=16;
</script>
<!-- v13.1：静态资源一律带 ?v=NN。
     起因：GitHub Pages 的 CDN 对 js 缓存 10 分钟，改完推送后玩家刷新看到的还是旧文件，
     以为是「没部署」。加版本号后每次发版只改这一个数字，浏览器/CDN 会当成新 URL 重新取。
     v14：冲刺无敌帧 0.10 → 0.15（engine.js / BAL.dash.inv）。
     v15：冲刺无敌帧 0.15 → 0.20。
     v16：Boss 招牌独占（六只零重合，charge 归牛魔王）+ 圣裁者新增 totem。
     v19：第二角色「星语法师」（C 键选角/法力条/陨星风暴；engine HEROES + ui 选角与 HUD；v22 资产版本：art 法师帧/弹体 + ui 弹体渲染）。
     v20：地图二「回响之厅」L20~L24（chapter4.js，五关全是 Boss；kind 7~11 各自一套「威胁来自玩家行为」的机制）。
     v25：15 个小怪关加入攻击交互迷你游戏（扫雷/点灯/编钟/打地鼠）+ 炸药桶 + 终点第四条「试炼」封印路线。
     v25.5：Boss 新增「天穹贯柱」光柱与星核/幽冥晶棘五招（column/pillar tone）+ 封印面板避让盘面。
     v26：14 个非 Boss 关彻底改为独立单屏街机小游戏（8 种类型），Boss 关仍是平台动作；
          选关屏仍把全部关卡按钮与 Boss 放在一起，详情标「街机 · 类型」。
     v27：小关消除重复玩法——14 关 14 种不同类型；新增矿脉寻宝/落块筑墙/弹幕生存/
          泡泡消除/迷宫追逃/垂直攀跃，原 6 对重复关卡各换掉一个。
     v28：地图三「终焉镜海」L25~L27（chapter5.js，三关全 Boss）+ 三只新 Boss：
          律动·俄耳甫斯（节拍承伤）/ 镜渊·无相（冲刺碎镜）/ 终焉·阿刻戎（凝视槽）。 -->
<script src="art.js?v=41"></script>
<script src="levels.js?v=41"></script>
<!-- v7 §1.1：章节文件（顶层 CHAPTERS.push 注册对象）；未交付时浏览器对 404 静默跳过，
     游戏以已合入章节运行（10/13/16/21/24 关皆合法）；chapter2/3/4/5.js 互相独立 -->
<script src="chapter2.js?v=41"></script>
<script src="chapter3.js?v=41"></script>
<script src="chapter4.js?v=41"></script>
<script src="chapter5.js?v=41"></script>
<script src="engine.js?v=41"></script>
<!-- v26：街机模式（固定单屏小游戏运行时）。放在 engine 之后、ui 之前：
     ui 的 startLevel/render/step 通过 window.ARCADE 分流；Boss 关不经过此文件。 -->
<script src="arcade.js?v=41"></script>
<script src="ui.js?v=41"></script>
</body>
</html>
